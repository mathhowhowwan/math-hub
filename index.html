<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>數學教學中心</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Sans TC', sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    header {
      background: linear-gradient(135deg, #16213e, #0f3460);
      padding: 14px max(24px, env(safe-area-inset-right, 0px)) 14px max(24px, env(safe-area-inset-left, 0px));
      padding-top: max(14px, env(safe-area-inset-top, 0px));
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.4);
      flex-shrink: 0;
    }

    header h1 {
      font-size: 1.2em;
      letter-spacing: 0.05em;
      color: #e2b96f;
    }

    header .subtitle {
      font-size: 0.8em;
      color: #aaa;
      margin-top: 2px;
    }

    nav {
      display: flex;
      background: #16213e;
      border-bottom: 2px solid #0f3460;
      flex-shrink: 0;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    nav button {
      padding: 12px 28px;
      min-height: 44px;
      white-space: nowrap;
      flex-shrink: 0;
      background: none;
      border: none;
      color: #aaa;
      font-size: 0.95em;
      cursor: pointer;
      border-bottom: 3px solid transparent;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    nav button:hover {
      color: #e2b96f;
      background: rgba(255,255,255,0.03);
    }

    nav button.active {
      color: #e2b96f;
      border-bottom-color: #e2b96f;
      background: rgba(226, 185, 111, 0.05);
    }

    nav button .tag {
      font-size: 0.7em;
      background: #e2b96f22;
      color: #e2b96f;
      padding: 2px 7px;
      border-radius: 10px;
    }

    .frame-container {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    iframe {
      position: absolute;
      top: 0; left: 0;
      width: 100%;
      height: 100%;
      border: none;
      display: none;
    }

    iframe.active {
      display: block;
    }

    .loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: #666;
      display: none;
    }

    .loading.show { display: block; }

    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid #333;
      border-top-color: #e2b96f;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    @media (max-width: 768px) {
      header { padding-top: max(10px, env(safe-area-inset-top, 0px)); padding-bottom: 10px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: max(14px, env(safe-area-inset-right, 0px)); }
      header h1 { font-size: 1.05em; }
      header .subtitle { font-size: 0.72em; }
      nav button { flex: 1; justify-content: center; padding: 10px 14px; font-size: 0.9em; }
    }
    @media (max-height: 480px) and (orientation: landscape) {
      header { padding-top: 6px; padding-bottom: 6px; }
      header .subtitle { display: none; }
    }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>📐 數學教學中心</h1>
      <div class="subtitle">國中數學 · 數學練功房 × 練習小遊戲</div>
    </div>
  </header>

  <nav>
    <button class="active" onclick="switchTab('cockpit', this)">
      🖥️ 數學練功房 <span class="tag">AI共創</span>
    </button>
    <button onclick="switchTab('game', this)">
      🎮 數學小遊戲 <span class="tag">練習</span>
    </button>
  </nav>

  <div class="frame-container">
    <div class="loading" id="loading">
      <div class="spinner"></div>
      <div>載入中...</div>
    </div>
    <iframe
      id="cockpit"
      class="active"
      src="https://mathhowhowwan.github.io/math-cockpit/"
      title="數學練功房"
    ></iframe>
    <iframe
      id="game"
      src=""
      data-src="https://mathhowhowwan.github.io/mathgame/"
      title="數學小遊戲"
    ></iframe>
  </div>

  <script>
    function switchTab(id, btn) {
      document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
      document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
      btn.classList.add('active');

      const frame = document.getElementById(id);

      // 延遲載入：第一次點擊才設定 src
      if (!frame.src || frame.src === window.location.href) {
        const src = frame.dataset.src;
        if (src) {
          document.getElementById('loading').classList.add('show');
          frame.src = src;
          frame.onload = () => document.getElementById('loading').classList.remove('show');
        }
      }

      frame.classList.add('active');
    }
  </script>

</body>
</html>
